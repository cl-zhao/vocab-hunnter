<!DOCTYPE html>
<html>
<head>
  <title>Generate Icons</title>
</head>
<body>
  <h1>Vocab Hunter Icon Generator</h1>
  <p>Open this file in a browser, then right-click each canvas to save as PNG.</p>

  <h3>16x16</h3>
  <canvas id="icon16" width="16" height="16"></canvas>

  <h3>48x48</h3>
  <canvas id="icon48" width="48" height="48"></canvas>

  <h3>128x128</h3>
  <canvas id="icon128" width="128" height="128"></canvas>

  <script>
    function drawIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      // Background gradient
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#667eea');
      gradient.addColorStop(1, '#764ba2');

      // Draw rounded rectangle
      const radius = size * 0.1875; // 24/128
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();

      // Letter V
      ctx.fillStyle = 'white';
      ctx.font = `bold ${size * 0.5}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('V', size / 2, size / 2 + size * 0.05);

      // Green checkmark circle (only for larger sizes)
      if (size >= 48) {
        const circleRadius = size * 0.14;
        const circleX = size - circleRadius - size * 0.1;
        const circleY = circleRadius + size * 0.1;

        ctx.beginPath();
        ctx.arc(circleX, circleY, circleRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#10b981';
        ctx.fill();

        // Checkmark
        ctx.fillStyle = 'white';
        ctx.font = `bold ${circleRadius}px Arial`;
        ctx.fillText('✓', circleX, circleY + circleRadius * 0.1);
      }
    }

    drawIcon('icon16', 16);
    drawIcon('icon48', 48);
    drawIcon('icon128', 128);
  </script>
</body>
</html>
